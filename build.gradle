import org.jetbrains.kotlin.gradle.dsl.ExplicitApiMode

buildscript {

    ext.compileJavaVersion = "11"

    //https://github.com/Kotlin/kotlinx.coroutines
    ext.coroutinesVersion = "1.10.2"

    //https://github.com/csense-oss/csense-kotlin-test
    ext.csenseTestsVersion = "0.0.1-Local"

    //https://github.com/csense-oss/csense-kotlin-annotations
    ext.csenseAnnotationVersion = "0.0.3"

    //https://github.com/JetBrains/kotlin/releases
    ext.kotlin_version = "2.2.0-RC2"

    //library settings - https://github.com/csense-oss/csense-kotlin
    ext.csenseVersionName = "0.0.3-Local"
    ext.csenseGroupId = "org.csenseoss.kotlin"

    ext.csenseUserOrg = "csense-oss"

    ext.csenseArtifactId = "csense-kotlin"
    ext.csenseLicense = "MIT"
    ext.csenseLicenseUrl = "https://mit-license.org/"

    ext.csenseDeveloperAlias = "tvede-dk"
    ext.csenseDeveloperName = "Kasper Tvede"
    ext.csenseDeveloperEmail = "csenseoss@tvedesys.dk"

    ext.csenseWebsite = "https://github.com/csense-oss/csense-kotlin"
    ext.csenseGit = "https://github.com/csense-oss/csense-kotlin.git"
    ext.csenseArtifactDescription = "aim of this project is to add further extensions, features to the std lib and \"very common\" operations."

}


plugins {
    id "maven-publish"
    //https://github.com/JetBrains/kotlin
    id 'org.jetbrains.kotlin.multiplatform' version "$kotlin_version"
    //https://github.com/Kotlin/kotlinx-kover
    id("org.jetbrains.kotlinx.kover") version "0.9.1"

    //https://github.com/dependency-check/DependencyCheck https://plugins.gradle.org/plugin/org.owasp.dependencycheck
    id "org.owasp.dependencycheck" version "12.1.1"
    //https://github.com/vanniktech/gradle-maven-publish-plugin
    id "com.vanniktech.maven.publish" version "0.32.0"
}

repositories {
    mavenCentral()
    mavenLocal()
//    maven {
//        url 'https://pkgs.dev.azure.com/csense-oss/csense-oss/_packaging/csense-oss/maven/v1'
//        name 'csense-oss'
//    }
}

kotlin {
    withSourcesJar(true)
    explicitApi = ExplicitApiMode.Strict
    jvm {
        compilations.configureEach {
            kotlinOptions.jvmTarget = compileJavaVersion
        }
        testRuns["test"].executionTask.configure {
            useJUnitPlatform()
        }
    }

    js(IR) {
        browser {
            testTask {
                useKarma {
                    useChrome()
                }
            }
        }
        nodejs()
    }

    //Native targets, based on https://kotlinlang.org/docs/native-target-support.html
    //- tier 1
//    macosX64()
//    macosArm64()
//    iosSimulatorArm64()
//    iosX64()

    //- tier 2
//    linuxX64()
//    linuxArm64()
//    watchosSimulatorArm64()
//    watchosX64()
//    watchosArm32()
//    watchosArm64()
//    tvosSimulatorArm64()
//    tvosX64()
//    tvosArm64()
//    iosArm64()

    //- tier 3
//    androidNativeArm32()
//    androidNativeArm64()
//    androidNativeX86()
//    androidNativeX64()
//    mingwX64()
//    androidNativeX64()
//    watchosDeviceArm64()
    //end native targets
    sourceSets {
        commonMain {
            dependencies {
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
                implementation "org.csenseoss.kotlin:csense-kotlin-annotations:$csenseAnnotationVersion"
            }
        }
        commonTest {
            dependencies {
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
                implementation "org.csenseoss.kotlin:csense-kotlin-tests:$csenseTestsVersion"
                implementation kotlin('test-common')
                implementation kotlin('test-annotations-common')
            }
        }

        configureEach {
            languageSettings {
                optIn("kotlin.contracts.ExperimentalContracts")
                optIn("kotlin.experimental.ExperimentalTypeInference")
                optIn("kotlinx.coroutines.ExperimentalCoroutinesApi")
                progressiveMode = true //https://kotlinlang.org/docs/whatsnew13.html#progressive-mode
            }
        }
    }
    targets.configureEach {
        compilations.configureEach {

//            kotlinOptions {
//                kotlinOptions.freeCompilerArgs += "-Xbackend-threads=0"
//                kotlinOptions.freeCompilerArgs += "-Xuse-fast-jar-file-system"
//                kotlinOptions.freeCompilerArgs += "-Xvalue-classes"
                //might be better now?
//                kotlinOptions.freeCompilerArgs += "-Xserialize-ir=all"
//                kotlinOptions.freeCompilerArgs += "-Xuse-inline-scopes-numbers"
//                kotlinOptions.freeCompilerArgs += "-Xuse-k2-kapt"

//                kotlinOptions.freeCompilerArgs += "-Xir-inliner"
//                allWarningsAsErrors = true
//            }
        }
    }
}

dependencyCheck {
    def allConfigsAsList = new ArrayList<>(configurations.getNames())
    def nonTestConfigurations = allConfigsAsList.findAll {
        !it.contains("Test") && (
                it.startsWith("js") ||
                        it.startsWith("jvm") ||
                        it.startsWith("jvm") ||
                        it.startsWith("common")
        )
    }

    analyzers {
        assemblyEnabled = false
    }
    scanConfigurations = nonTestConfigurations
    skipTestGroups = true
    failOnError = true
}

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(compileJavaVersion))
    }
}


project.group = csenseGroupId
project.version = csenseVersionName

mavenPublishing {
    coordinates(csenseGroupId, csenseArtifactId, csenseVersionName)
}

apply from: "$projectDir/gradle/publish.gradle"